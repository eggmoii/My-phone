
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>김솔음의 휴대폰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{position:absolute;inset:0;height:100dvh;overflow:hidden;background:#050505}
.hidden{display:none!important}
.status{position:absolute;top:0;left:0;width:100%;height:58px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;z-index:10;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:105px;height:29px;border-radius:22px;background:black}
.rightstatus{display:flex;align-items:center;gap:7px}
.signal{display:flex;align-items:end;gap:2px;height:15px}
.signal i{width:4px;background:white;border-radius:1px}
.signal i:nth-child(1){height:5px}
.signal i:nth-child(2){height:8px}
.signal i:nth-child(3){height:11px}
.signal i:nth-child(4){height:14px}
.wifi{width:18px;height:18px}
.battery{width:27px;height:15px}
.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:125px;height:5px;background:white;border-radius:9px;z-index:12}
.lockclock{position:absolute;top:17%;width:100%;text-align:center}
.lockicon{font-size:22px;margin-bottom:12px}
.bigtime{font-size:clamp(68px,21vw,92px);font-weight:200;letter-spacing:-4px;line-height:1.1}
.date{font-size:19px;margin-top:10px}
.shortcuts{position:absolute;bottom:65px;width:100%;padding:0 35px;display:flex;justify-content:space-between}
.round{width:52px;height:52px;border:0;border-radius:50%;background:#303030;color:white;display:grid;place-items:center}
.round svg{width:24px;height:24px}
.hintlock{position:absolute;bottom:43px;width:100%;text-align:center;font-size:12px;color:#bbb}
#pass{text-align:center}
.passarea{position:absolute;top:13%;width:100%}
.passlabel{font-size:19px;margin:14px 0 9px}
.hint{height:23px;margin-bottom:8px;color:#f9d47a;font-size:15px}
.dots{display:flex;justify-content:center;gap:21px;margin:10px 0 27px}
.dot{width:13px;height:13px;border:1.5px solid white;border-radius:50%}
.dot.filled{background:white}
.keypad{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:12px 22px}
.key{width:68px;height:68px;border:0;border-radius:50%;background:#303030;color:white;font-size:29px;font-weight:300}
.key:active{background:#666}
.key.blank{visibility:hidden}
.passbottom{position:absolute;bottom:50px;width:100%;display:flex;justify-content:space-around}
.passbottom button{background:none;border:0;color:white;font-size:15px}
.shake{animation:shake .36s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-11px)}40%,80%{transform:translateX(11px)}}
#home{background:linear-gradient(155deg,#1b1b1d,#050505)}
.apps{position:absolute;top:110px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:25px 4px;padding:0 12px}
.app{border:0;background:none;color:white;text-align:center;font-size:12px;padding:0;display:flex;align-items:center;flex-direction:column;gap:6px}
.appicon{width:min(16vw,62px);height:min(16vw,62px);border-radius:15px;display:grid;place-items:center;overflow:hidden}
.appicon svg{width:85%;height:85%}
.appname{white-space:nowrap}
.dock{position:absolute;bottom:35px;left:4%;width:92%;border-radius:27px;background:#ffffff26;display:flex;justify-content:space-around;padding:12px 5px}
.toast{position:absolute;top:45%;left:10%;width:80%;background:#252525ee;border-radius:14px;padding:15px;text-align:center;font-size:14px}
@media(max-height:620px){.passarea{top:9%}.keypad{gap:7px 20px;grid-template-columns:repeat(3,58px)}.key{width:58px;height:58px}.dots{margin-bottom:12px}.apps{top:80px;gap:12px 4px}}
</style>
</head>
<body>
<template id="statusTemplate">
<div class="status">
<span class="smalltime">9:41</span>
<div class="island"></div>
<div class="rightstatus">
<span class="signal"><i></i><i></i><i></i><i></i></span>
<svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.7" stroke-linecap="round"><path d="M2.5 8.5a15 15 0 0 1 19 0M6 12.5a10 10 0 0 1 12 0M9.5 16a5 5 0 0 1 5 0"/><circle cx="12" cy="19" r="1.5" fill="white" stroke="none"/></svg>
<svg class="battery" viewBox="0 0 29 16"><rect x="1" y="1.5" width="24" height="13" rx="3.5" fill="none" stroke="white" stroke-width="1.5"/><rect x="3.5" y="4" width="18" height="8" rx="1.8" fill="white"/><path d="M26.5 5.5q3 2.5 0 5" stroke="white" stroke-width="1.5" fill="none"/></svg>
</div>
</div>
</template>

<section id="lock" class="screen">
<div class="lockclock">
<div class="lockicon">🔒</div>
<div class="bigtime liveTime">9:41</div>
<div class="date" id="date"></div>
</div>
<div class="shortcuts">
<button class="round" aria-label="손전등">
<svg viewBox="0 0 24 24" fill="white"><path d="M7 2h10l-1.2 8-2.5 3v7.5a1.3 1.3 0 0 1-2.6 0V13l-2.5-3z"/></svg>
</button>
<button class="round" aria-label="카메라">
<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><rect x="2" y="6" width="20" height="15" rx="3"/><path d="M7 6l2-3h6l2 3"/><circle cx="12" cy="13.5" r="4"/></svg>
</button>
</div>
<div class="hintlock">위로 쓸어올려 잠금 해제</div>
<div class="homebar" id="swipebar"></div>
</section>

<section id="pass" class="screen hidden">
<div class="passarea">
<div class="lockicon">🔒</div>
<div class="passlabel">암호 입력</div>
<div class="hint" id="hint"></div>
<div class="dots" id="dots">
<span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div>
<div class="keypad" id="keys"></div>
</div>
<div class="passbottom">
<button id="cancel">취소</button>
<button id="delete">지우기</button>
</div>
<div class="homebar"></div>
</section>

<section id="home" class="screen hidden">
<div class="apps" id="apps"></div>
<div class="dock" id="dock"></div>
<div class="toast hidden" id="toast"></div>
<div class="homebar" id="homebar"></div>
</section>

<script>
const $=id=>document.getElementById(id);
document.querySelectorAll('.screen').forEach(s=>s.prepend($('statusTemplate').content.cloneNode(true)));

function clock(){
const n=new Date();
const t=n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
document.querySelectorAll('.smalltime,.liveTime').forEach(e=>e.textContent=t);
$('date').textContent=n.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
clock();
setInterval(clock,1000);

const lock=$('lock'),pass=$('pass'),home=$('home');
function show(el){
[lock,pass,home].forEach(x=>x.classList.add('hidden'));
el.classList.remove('hidden');
}
let startY=null;
lock.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});
lock.addEventListener('touchend',e=>{
if(startY!==null&&startY-e.changedTouches[0].clientY>45)show(pass);
startY=null;
},{passive:true});
$('swipebar').onclick=()=>show(pass);

let pin='',checking=false;
const dots=[...document.querySelectorAll('.dot')];
function renderDots(){
dots.forEach((d,i)=>d.classList.toggle('filled',i<pin.length));
}
function enter(n){
if(checking||pin.length>=4)return;
pin+=n;
renderDots();
if(pin.length===4){
checking=true;
setTimeout(()=>{
if(pin==='0913'){
pin='';
renderDots();
$('hint').textContent='';
show(home);
}else{
$('hint').textContent='힌트 : 생일';
$('dots').classList.add('shake');
setTimeout(()=>$('dots').classList.remove('shake'),380);
pin='';
renderDots();
}
checking=false;
},240);
}
}
['1','2','3','4','5','6','7','8','9','','0',''].forEach(n=>{
const b=document.createElement('button');
b.className='key'+(!n?' blank':'');
b.textContent=n;
if(n)b.onclick=()=>enter(n);
$('keys').appendChild(b);
});
$('cancel').onclick=()=>{
pin='';checking=false;renderDots();
$('hint').textContent='';show(lock);
};
$('delete').onclick=()=>{
if(checking)return;
pin=pin.slice(0,-1);renderDots();
};

const svg=c=>'<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">'+c+'</svg>';
const icons={
message:svg('<path fill="white" d="M12 13h40a9 9 0 0 1 9 9v18a9 9 0 0 1-9 9H29L15 58l3-11a9 9 0 0 1-6-8V22a9 9 0 0 1 9-9z"/>'),
photos:svg('<g transform="translate(32 32)"><ellipse rx="7" ry="17" cy="-14" fill="#ff4c5d"/><ellipse rx="7" ry="17" cy="-14" fill="#ff9b36" transform="rotate(45)"/><ellipse rx="7" ry="17" cy="-14" fill="#ffdc3e" transform="rotate(90)"/><ellipse rx="7" ry="17" cy="-14" fill="#69c84b" transform="rotate(135)"/><ellipse rx="7" ry="17" cy="-14" fill="#4cc9d9" transform="rotate(180)"/><ellipse rx="7" ry="17" cy="-14" fill="#4a8df5" transform="rotate(225)"/><ellipse rx="7" ry="17" cy="-14" fill="#a36cf5" transform="rotate(270)"/><ellipse rx="7" ry="17" cy="-14" fill="#f56ba7" transform="rotate(315)"/><circle r="6" fill="#fff6cf"/></g>'),
notes:svg('<rect width="64" height="64" fill="#fff"/><rect width="64" height="15" fill="#f8ce49"/><path d="M9 28h46M9 38h46M9 48h34" stroke="#d3d3d3" stroke-width="2"/>'),
calendar:svg('<rect width="64" height="64" fill="#fff"/><text x="32" y="17" font-size="13" text-anchor="middle" font-family="Arial" fill="#e64d48" class="calWeek">MON</text><text x="32" y="53" font-size="40" font-weight="300" text-anchor="middle" font-family="Arial" fill="#111" class="calDay">26</text>'),
music:svg('<path d="M37 10v32a9 9 0 1 1-6-8V17l22-5v25a9 9 0 1 1-6-8V7z" fill="white"/>'),
x:svg('<path d="M12 10h10l30 44H42zM46 10h7L18 54h-7z" fill="white"/>'),
settings:svg('<text x="32" y="48" text-anchor="middle" font-size="49">⚙️</text>'),
secret:svg('<rect x="9" y="26" width="46" height="31" rx="7" fill="#ddd"/><path d="M19 26v-9a13 13 0 0 1 26 0v9" fill="none" stroke="#ddd" stroke-width="7"/><circle cx="32" cy="40" r="4" fill="#555"/>'),
phone:svg('<path d="M16 9c-6 2-8 8-6 16 4 16 18 29 33 31 8 1 12-3 13-9l-14-9-8 7C24 40 20 34 18 26l7-6z" fill="white"/>'),
safari:svg('<circle cx="32" cy="32" r="28" fill="#e9f6ff"/><circle cx="32" cy="32" r="24" fill="#229af0"/><path d="M42 19 28 29 21 45l14-12z" fill="white"/><path d="M42 19 28 29l7 4z" fill="#f34e59"/>'),
camera:svg('<rect x="6" y="17" width="52" height="38" rx="8" fill="#ddd"/><path d="M18 17l5-7h18l5 7" fill="#ddd"/><circle cx="32" cy="36" r="14" fill="#777"/><circle cx="32" cy="36" r="10" fill="#333"/>'),
contacts:svg('<circle cx="32" cy="23" r="12" fill="#f2f2f2"/><path d="M9 56c1-14 11-21 23-21s22 7 23 21" fill="#f2f2f2"/>')
};

const appList=[
['메시지','message','#35c85a'],
['사진','photos','#fff'],
['메모','notes','#fff'],
['캘린더','calendar','#fff'],
['음악','music','#fa4260'],
['X','x','#111'],
['설정','settings','#747474'],
['비밀 폴더','secret','#454550']
];
const dockList=[
['전화','phone','#34c759'],
['Safari','safari','#fff'],
['카메라','camera','#858585'],
['연락처','contacts','#858585']
];
let toastTimer;
function makeApp([name,key,bg],inDock=false){
const b=document.createElement('button');
b.className='app';
const icon=document.createElement('div');
icon.className='appicon';
icon.style.background=bg;
icon.innerHTML=icons[key];
b.appendChild(icon);
if(!inDock){
const label=document.createElement('span');
label.className='appname';
label.textContent=name;
b.appendChild(label);
}
b.onclick=()=>{
const t=$('toast');
t.textContent=name+' 앱은 다음에 만들 거야!';
t.classList.remove('hidden');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.add('hidden'),1600);
};
return b;
}
appList.forEach(a=>$('apps').appendChild(makeApp(a)));
dockList.forEach(a=>$('dock').appendChild(makeApp(a,true)));

function updateCalendar(){
const n=new Date();
document.querySelectorAll('.calDay').forEach(e=>e.textContent=n.getDate());
document.querySelectorAll('.calWeek').forEach(e=>e.textContent=['SUN','MON','TUE','WED','THU','FRI','SAT'][n.getDay()]);
}
updateCalendar();
setInterval(updateCalendar,60000);
$('homebar').onclick=()=>show(lock);
</script>
</body>
</html>

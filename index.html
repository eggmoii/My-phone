
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>김솔음의 휴대폰</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  color:inherit;
  cursor:pointer;
}

.phone{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:radial-gradient(
    ellipse at 50% 25%,
    #19191b,
    #080808 78%
  );
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}

/* 상단 상태바 */
.status{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  z-index:10;
  font-size:15px;
  font-weight:600;
  pointer-events:none;
}

.island{
  position:absolute;
  left:50%;
  top:11px;
  transform:translateX(-50%);
  width:110px;
  height:31px;
  border-radius:22px;
  background:#000;
}

.indicators{
  display:flex;
  align-items:center;
  gap:9px;
}

.signal{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:15px;
}

.signal i{
  display:block;
  width:4px;
  background:#fff;
  border-radius:2px;
}

.signal i:nth-child(1){height:5px}
.signal i:nth-child(2){height:8px}
.signal i:nth-child(3){height:12px}
.signal i:nth-child(4){height:15px}

.battery{
  position:relative;
  width:25px;
  height:13px;
  border:1.7px solid #fff;
  border-radius:4px;
  padding:2px;
}

.battery:after{
  content:"";
  position:absolute;
  right:-4px;
  top:3px;
  width:2px;
  height:5px;
  background:#fff;
  border-radius:2px;
}

.battery-fill{
  width:70%;
  height:100%;
  background:#fff;
  border-radius:1px;
}

.homebar{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:5px;
  background:#fff;
  border-radius:10px;
  z-index:15;
  cursor:pointer;
}

/* 잠금화면 */
.lockclock{
  position:absolute;
  top:17%;
  width:100%;
  text-align:center;
}

.bigtime{
  font-size:clamp(68px,20vw,94px);
  font-weight:200;
  letter-spacing:-4px;
}

.date{
  font-size:20px;
  margin-top:7px;
}

.locktip{
  position:absolute;
  bottom:110px;
  width:100%;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

.lockbottom{
  position:absolute;
  bottom:43px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 34px;
}

.round{
  border:0;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#292929;
  display:grid;
  place-items:center;
}

.round svg{
  width:25px;
  height:25px;
  stroke:white;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* 비밀번호 */
.passwrap{
  position:absolute;
  top:20%;
  width:100%;
  text-align:center;
}

.passlabel{
  font-size:21px;
  margin-bottom:20px;
}

.hint{
  min-height:30px;
  color:#ffce67;
  font-size:15px;
  margin-bottom:12px;
  padding:0 10px;
}

.dots{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:35px;
}

.dot{
  width:13px;
  height:13px;
  border:1.5px solid #fff;
  border-radius:50%;
}

.dot.filled{
  background:#fff;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,72px);
  justify-content:center;
  gap:13px 21px;
}

.key{
  width:72px;
  height:72px;
  border:0;
  border-radius:50%;
  background:#ffffff25;
  font-size:30px;
  font-weight:300;
}

.key:active{
  background:#ffffff55;
}

.passfooter{
  display:flex;
  justify-content:space-between;
  max-width:270px;
  margin:24px auto;
}

.passfooter button{
  border:0;
  background:none;
  font-size:15px;
}

/* 홈 화면 */
.apps{
  position:absolute;
  top:14.5%;
  left:0;
  width:100%;
  padding:0 6%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:13px;
  row-gap:27px;
}

.app{
  text-align:center;
  min-width:0;
}

.appicon{
  width:min(100%,76px);
  aspect-ratio:1;
  margin:auto;
  border-radius:19px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#333;
  box-shadow:0 4px 12px #00000025;
}

.appicon svg{
  width:100%;
  height:100%;
  display:block;
}

.appname{
  font-size:12px;
  margin-top:8px;
  white-space:nowrap;
  font-weight:400;
}

/* 하단 Dock */
.dock{
  position:absolute;
  bottom:34px;
  left:3%;
  width:94%;
  padding:15px 9px;
  border-radius:34px;
  background:#ffffff2e;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}

.dock .app{
  cursor:pointer;
}

.dock .appicon{
  width:min(100%,76px);
}

.dock .appname{
  display:none;
}

/* 앱 공통 화면 */
.page{
  position:absolute;
  inset:55px 0 0;
  background:#101012;
  display:none;
  z-index:12;
}

.page.open{
  display:flex;
  flex-direction:column;
}

.pageheader{
  height:60px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  font-size:20px;
  font-weight:600;
  border-bottom:1px solid #ffffff20;
}

.back{
  background:none;
  border:0;
  color:#4b9cff;
  font-size:17px;
}

.pagebody{
  padding:20px;
  overflow:auto;
  flex:1;
  padding-bottom:75px;
}

.item{
  background:#242427;
  border-radius:12px;
  padding:16px;
  margin-bottom:10px;
}

.field{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:0;
  background:#303035;
  color:#fff;
  font-size:16px;
  margin:8px 0;
}

.action{
  background:#3289ff;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  margin:6px 4px 6px 0;
}

textarea.field{
  min-height:170px;
  resize:vertical;
}

.muted{
  color:#aaa;
  font-size:13px;
}

.center{
  text-align:center;
}

.empty{
  color:#999;
  text-align:center;
  padding:30px 10px;
  font-size:14px;
}

/* 가상 전화 */
.phone-app{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:12px 0 20px;
}

.phone-display{
  width:100%;
  height:75px;
  text-align:center;
  font-size:32px;
  font-weight:300;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.phone-keys{
  display:grid;
  grid-template-columns:repeat(3,72px);
  gap:13px 20px;
  justify-content:center;
}

.phone-key{
  width:72px;
  height:72px;
  border:0;
  border-radius:50%;
  background:#29292b;
  font-size:30px;
  font-weight:300;
}

.phone-key:active{
  background:#555;
}

.phone-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  margin-top:23px;
}

.call-button{
  border:0;
  width:68px;
  height:68px;
  border-radius:50%;
  background:#34c759;
  display:grid;
  place-items:center;
  font-size:32px;
}

.delete-button{
  background:none;
  border:0;
  font-size:25px;
  width:50px;
}

.phone-tabs{
  display:flex;
  justify-content:space-around;
  gap:5px;
  margin-bottom:15px;
}

.phone-tab{
  flex:1;
  background:#252528;
  border:0;
  padding:10px 3px;
  border-radius:9px;
  font-size:13px;
}

.phone-tab.selected{
  background:#367ff4;
}

.call-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-around;
  min-height:65vh;
  text-align:center;
}

.call-name{
  font-size:32px;
  margin-top:40px;
}

.call-state{
  color:#aaa;
  margin-top:12px;
}

.end-call{
  width:75px;
  height:75px;
  border:0;
  border-radius:50%;
  background:#ff3b30;
  font-size:32px;
  margin-bottom:45px;
}

/* 가상 메시지 */
.chat-bubble{
  max-width:82%;
  background:#34c759;
  border-radius:18px;
  padding:12px 15px;
  margin:10px 0 10px auto;
  overflow-wrap:anywhere;
}

.chat-compose{
  display:flex;
  gap:8px;
  align-items:center;
}

.chat-compose .field{
  flex:1;
  min-width:0;
}

/* 가상 음악 */
.music-cover{
  width:min(75vw,250px);
  aspect-ratio:1;
  margin:20px auto;
  border-radius:20px;
  background:linear-gradient(135deg,#f04b76,#7426b8);
  display:grid;
  place-items:center;
  font-size:100px;
}

.music-progress{
  width:100%;
  height:5px;
  border-radius:5px;
  background:#444;
  margin:25px 0;
  overflow:hidden;
}

.music-progress div{
  width:0%;
  height:100%;
  background:white;
}

.music-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35px;
  margin-top:25px;
}

.music-controls button{
  background:none;
  border:0;
  font-size:32px;
}

/* 가상 Safari */
.browser-bar{
  display:flex;
  gap:8px;
  align-items:center;
}

.browser-bar .field{
  flex:1;
  min-width:0;
}

.browser-preview{
  background:#fff;
  color:#222;
  border-radius:12px;
  min-height:250px;
  padding:25px 18px;
  margin-top:15px;
}

.browser-preview h2{
  font-size:22px;
  margin-top:0;
}

@media(max-height:650px){
  .apps{
    top:17%;
    row-gap:18px;
  }

  .appicon{
    width:min(100%,64px);
  }

  .dock .appicon{
    width:min(100%,64px);
  }

  .dock{
    padding:10px 8px;
  }
}
</style>
</head>

<body>
<div class="phone">

<!-- 상단바 -->
<div class="status">
  <span id="statusTime">9:41</span>

  <div class="island"></div>

  <div class="indicators">
    <div class="signal">
      <i></i><i></i><i></i><i></i>
    </div>

    <div class="battery">
      <div class="battery-fill"></div>
    </div>
  </div>
</div>

<!-- 잠금화면 -->
<section class="screen active" id="lock">
  <div class="lockclock">
    <div class="bigtime" id="bigTime">9:41</div>
    <div class="date" id="date"></div>
  </div>

  <div class="locktip">위로 쓸어올려 잠금 해제</div>

  <div class="lockbottom">
    <button class="round" onclick="virtualFlashlight()" aria-label="손전등">
      <svg viewBox="0 0 24 24">
        <path d="M8 3h8v5l-2 3v9h-4v-9L8 8zM10 14h4"/>
      </svg>
    </button>

    <button class="round" onclick="show('pass')" aria-label="카메라">
      <svg viewBox="0 0 24 24">
        <path d="M3 7h4l2-3h6l2 3h4v13H3z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>
</section>

<!-- 비밀번호 -->
<section class="screen" id="pass">
  <div class="passwrap">
    <div class="passlabel">암호 입력</div>
    <div class="hint" id="hint"></div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="keypad" id="keys"></div>

    <div class="passfooter">
      <button onclick="cancelPin()">취소</button>
      <button onclick="erasePin()">삭제</button>
    </div>
  </div>
</section>

<!-- 홈 화면 -->
<section class="screen" id="home">
  <div class="apps" id="apps"></div>
  <div class="dock" id="dock"></div>
</section>

<!-- 가상 앱 화면 -->
<div class="page" id="page">
  <div class="pageheader">
    <button class="back" onclick="closeApp()">‹ 뒤로</button>
    <span id="pageTitle"></span>
    <span style="width:40px"></span>
  </div>

  <div class="pagebody" id="pageBody"></div>
</div>

<div class="homebar" id="homebar"></div>

</div>

<script>
/*
  김솔음의 휴대폰

  홈 화면 8개 앱:
  터치해도 아무 변화 없음

  Dock 4개 앱:
  웹사이트 내부 가상 기능만 사용

  실제 휴대폰 앱 연결 없음
*/

const icons={

'음악':`
<svg viewBox="0 0 80 80">
  <defs>

    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#musicBg)"/>
  <path d="M38 17V55Q33 49 25 53Q15 57 19 65Q23 72 33 66Q38 63 38 56V31L59 26V49Q54 44 47 48Q37 52 41 60Q45 68 55 62Q61 59 61 52V15Z"
    fill="white"/>
</svg>`
};

/* 지정된 홈 화면 구성 */
const mainApps=[
  '캘린더',
  '사진',
  '카메라',
  '지도',
  '메모',
  '날씨',
  '미리알림',
  '네이버'
];

/* 지정된 Dock 구성 */
const dockApps=[
  '전화',
  'Safari',
  '메시지',
  '음악'
];

function loadData(key,fallback){
  try{
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  }catch(e){
    return fallback;
  }
}

function saveData(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
  }catch(e){
    alert('가상 데이터를 저장할 수 없습니다.');
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

let pin='';
let checking=false;
let currentApp='';
let phoneNumber='';
let phoneTab='키패드';
let currentCall='';
let callStart=0;
let callTimer=null;
let selectedChat='';
let musicPlaying=false;
let musicSeconds=0;
let musicTimer=null;

let contacts=loadData('solContacts',[]);
let messages=loadData('solMessages',[]);
let callHistory=loadData('solCallHistory',[]);

/* 실시간 시계와 캘린더 아이콘 */
function updateClock(){
  const now=new Date();

  const time=now.toLocaleTimeString('ko-KR',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });

  document.getElementById('statusTime').textContent=time;
  document.getElementById('bigTime').textContent=time;

  document.getElementById('date').textContent=
    now.toLocaleDateString('ko-KR',{
      month:'long',
      day:'numeric',
      weekday:'long'
    });

  const days=[
    '일요일','월요일','화요일','수요일',
    '목요일','금요일','토요일'
  ];

  const cal=document.querySelector('#apps #calDay');
  const date=document.querySelector('#apps #calDate');

  if(cal)cal.textContent=days[now.getDay()];
  if(date)date.textContent=now.getDate();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
  document.getElementById('page').classList.remove('open');
}

function makeApp(name,isDock){
  const el=document.createElement('div');
  el.className='app';

  el.innerHTML=`
    <div class="appicon">${icons[name]}</div>
    <div class="appname">${name}</div>
  `;

  /*
    홈 화면 8개 앱:
    클릭 이벤트를 등록하지 않음.
    터치해도 아무 변화 없음.
  */

  if(isDock){
    el.onclick=()=>openApp(name);
  }

  return el;
}

mainApps.forEach(name=>{
  document.getElementById('apps').appendChild(
    makeApp(name,false)
  );
});

dockApps.forEach(name=>{
  document.getElementById('dock').appendChild(
    makeApp(name,true)
  );
});

updateClock();
setInterval(updateClock,1000);

/* 비밀번호 */
function renderDots(){
  document.querySelectorAll('.dot').forEach((dot,i)=>{
    dot.classList.toggle('filled',i<pin.length);
  });
}

function addPin(n){
  if(checking||pin.length>=4)return;

  pin+=n;
  renderDots();

  if(pin.length===4){
    checking=true;

    setTimeout(()=>{
      if(pin==='0913'){
        pin='';
        renderDots();
        document.getElementById('hint').textContent='';
        show('home');

      }else if(pin==='0511'){
        pin='';
        renderDots();

        document.getElementById('hint').textContent=
          '그건 제 생일인데요, 주임님';

      }else{
        pin='';
        renderDots();

        document.getElementById('hint').textContent=
          '힌트 : 생일';
      }

      checking=false;
    },220);
  }
}

function erasePin(){
  if(checking)return;
  pin=pin.slice(0,-1);
  renderDots();
}

function cancelPin(){
  pin='';
  checking=false;
  renderDots();

  document.getElementById('hint').textContent='';
  show('lock');
}

const keys=document.getElementById('keys');

['1','2','3','4','5','6','7','8','9','','0',''].forEach(n=>{
  const button=document.createElement('button');

  button.className='key';
  button.textContent=n;

  if(n){
    button.onclick=()=>addPin(n);
  }else{
    button.style.visibility='hidden';
  }

  keys.appendChild(button);
});

let startY=0;

document.getElementById('lock').addEventListener(
  'touchstart',
  e=>{
    startY=e.touches[0].clientY;
  },
  {passive:true}
);

document.getElementById('lock').addEventListener(
  'touchend',
  e=>{
    if(startY-e.changedTouches[0].clientY>45){
      show('pass');
    }
  }
);

document.getElementById('lock').addEventListener('click',e=>{
  if(!e.target.closest('button')){
    show('pass');
  }
});

document.getElementById('homebar').onclick=()=>{
  if(document.getElementById('page').classList.contains('open')){
    closeApp();
  }else if(document.getElementById('lock').classList.contains('active')){
    show('pass');
  }else if(document.getElementById('pass').classList.contains('active')){
    cancelPin();
  }else{
    show('home');
  }
};

function virtualFlashlight(){
  const lock=document.getElementById('lock');
  const enabled=lock.dataset.light==='on';

  lock.dataset.light=enabled?'off':'on';

  lock.style.background=enabled
    ?''
    :'radial-gradient(circle at 50% 50%,#777,#242424 80%)';
}

/* 앱 열기 */
function openApp(name){
  currentApp=name;

  document.getElementById('pageTitle').textContent=name;
  document.getElementById('page').classList.add('open');

  renderApp();
}

function closeApp(){
  if(callTimer){
    clearInterval(callTimer);
    callTimer=null;
  }

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
    musicPlaying=false;
  }

  document.getElementById('page').classList.remove('open');
  show('home');
}

function setBody(html){
  document.getElementById('pageBody').innerHTML=html;
}

function renderApp(){
  if(currentApp==='전화')renderPhone();
  else if(currentApp==='메시지')renderMessages();
  else if(currentApp==='음악')renderMusic();
  else if(currentApp==='Safari')renderSafari();
}

/* 전화: 가상 통화만 */
function renderPhone(){
  const tabs=['즐겨찾기','최근 통화','연락처','키패드'];

  let html=`
    <div class="phone-tabs">
      ${tabs.map(t=>`
        <button
          class="phone-tab ${phoneTab===t?'selected':''}"
          onclick="changePhoneTab('${t}')"
        >${t}</button>
      `).join('')}
    </div>
  `;

  if(phoneTab==='키패드'){
    html+=`
      <div class="phone-app">
        <div class="phone-display" id="phoneDisplay">
          ${esc(phoneNumber)}
        </div>

        <div class="phone-keys">
          ${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`
            <button class="phone-key" onclick="pressPhoneKey('${n}')">
              ${n}
            </button>
          `).join('')}
        </div>

        <div class="phone-controls">
          <button class="delete-button" onclick="deletePhoneKey()">⌫</button>
          <button class="call-button" onclick="startVirtualCall()">☎</button>
          <span style="width:50px"></span>
        </div>
      </div>
    `;
  }

  if(phoneTab==='최근 통화'){
    html+=callHistory.length
      ?callHistory.map((c,i)=>`
        <div class="item" onclick="callHistoryNumber(${i})">
          <b>${esc(c.number)}</b>
          <p class="muted">${esc(c.date)}</p>
        </div>
      `).join('')
      :'<div class="empty">최근 통화가 없습니다.</div>';
  }

  if(phoneTab==='연락처'){
    html+=contacts.length
      ?contacts.map((c,i)=>`
        <div class="item" onclick="callContact(${i})">
          <b>${esc(c.name)}</b>
          <p class="muted">${esc(c.phone)}</p>
        </div>
      `).join('')
      :'<div class="empty">저장된 가상 연락처가 없습니다.</div>';
  }

  if(phoneTab==='즐겨찾기'){
    html+='<div class="empty">즐겨찾기가 없습니다.</div>';
  }

  setBody(html);
}

function changePhoneTab(tab){
  phoneTab=tab;
  renderPhone();
}

function pressPhoneKey(n){
  if(phoneNumber.length>=20)return;

  phoneNumber+=n;

  const display=document.getElementById('phoneDisplay');
  if(display)display.textContent=phoneNumber;
}

function deletePhoneKey(){
  phoneNumber=phoneNumber.slice(0,-1);

  const display=document.getElementById('phoneDisplay');
  if(display)display.textContent=phoneNumber;
}

function callHistoryNumber(i){
  phoneNumber=callHistory[i].number;
  startVirtualCall();
}

function callContact(i){
  phoneNumber=contacts[i].phone;
  startVirtualCall();
}

function startVirtualCall(){
  if(!phoneNumber)return;

  currentCall=phoneNumber;
  callStart=Date.now();

  callHistory.unshift({
    number:currentCall,
    date:new Date().toLocaleString('ko-KR')
  });

  saveData('solCallHistory',callHistory);

  setBody(`
    <div class="call-screen">
      <div>
        <div class="call-name">${esc(currentCall)}</div>
        <div class="call-state" id="callState">
          가상 통화 중 · 00:00
        </div>
      </div>

      <div class="muted">
        실제 전화는 연결되지 않습니다.
      </div>

      <button class="end-call" onclick="endVirtualCall()">☎</button>
    </div>
  `);

  if(callTimer)clearInterval(callTimer);

  callTimer=setInterval(()=>{
    const seconds=Math.floor((Date.now()-callStart)/1000);

    const mm=String(Math.floor(seconds/60)).padStart(2,'0');
    const ss=String(seconds%60).padStart(2,'0');

    const state=document.getElementById('callState');

    if(state){
      state.textContent=`가상 통화 중 · ${mm}:${ss}`;
    }
  },1000);
}

function endVirtualCall(){
  if(callTimer){
    clearInterval(callTimer);
    callTimer=null;
  }

  phoneNumber='';
  phoneTab='키패드';
  renderPhone();
}

/* 메시지: 가상 대화만 */
function renderMessages(){
  selectedChat='';

  const people=[...new Set(messages.map(m=>m.to))];

  setBody(`
    <button class="action" onclick="newChat()">+ 새 메시지</button>

    ${people.length
      ?people.map((person,i)=>{
        const count=messages.filter(m=>m.to===person).length;

        return `
          <div class="item" onclick="openChatByIndex(${i})">
            <b>${esc(person)}</b>
            <p class="muted">가상 메시지 ${count}개</p>
          </div>
        `;
      }).join('')
      :'<div class="empty">메시지가 없습니다.</div>'
    }
  `);
}

let selectedChat='';

function newChat(){
  setBody(`
    <h3>새 메시지</h3>

    <input class="field" id="newChatName" placeholder="받는 사람 이름">

    <button class="action" onclick="createChat()">대화 시작</button>
  `);
}

function createChat(){
  const name=document.getElementById('newChatName').value.trim();
  if(!name)return;

  selectedChat=name;
  renderChat();
}

function openChatByIndex(i){
  const people=[...new Set(messages.map(m=>m.to))];

  selectedChat=people[i];
  renderChat();
}

function renderChat(){
  const conversation=messages.filter(m=>m.to===selectedChat);

  setBody(`
    <h3 class="center">${esc(selectedChat)}</h3>

    <div>
      ${conversation.length
        ?conversation.map(m=>`
          <div class="chat-bubble">${esc(m.msg)}</div>
        `).join('')
        :'<div class="empty">새로운 가상 대화입니다.</div>'
      }
    </div>

    <div class="chat-compose">
      <input class="field" id="chatInput" placeholder="메시지">

      <button class="action" onclick="sendVirtualMessage()">전송</button>
    </div>

    <button class="action" onclick="renderMessages()">대화 목록</button>
  `);
}

function sendVirtualMessage(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();

  if(!text)return;

  messages.push({
    to:selectedChat,
    msg:text
  });

  saveData('solMessages',messages);
  renderChat();
}

/* 음악: 가상 플레이어 */
function renderMusic(){
  setBody(`
    <div class="music-cover">♫</div>

    <h2 class="center">김솔음의 플레이리스트</h2>
    <p class="center muted">가상 Apple Music</p>

    <div class="music-progress">
      <div id="musicProgress" style="width:${musicSeconds/180*100}%"></div>
    </div>

    <div class="center muted" id="musicTime">
      ${formatMusicTime(musicSeconds)} / 03:00
    </div>

    <div class="music-controls">
      <button onclick="resetMusic()">⏮</button>

      <button onclick="toggleMusic()" id="musicPlayButton">
        ${musicPlaying?'⏸':'▶'}
      </button>

      <button onclick="resetMusic()">⏭</button>
    </div>

    <p class="center muted" style="margin-top:30px">
      실제 음악 앱이나 음악 파일에는 접근하지 않습니다.
    </p>
  `);
}

function formatMusicTime(seconds){
  const mm=String(Math.floor(seconds/60)).padStart(2,'0');
  const ss=String(seconds%60).padStart(2,'0');

  return `${mm}:${ss}`;
}

function toggleMusic(){
  musicPlaying=!musicPlaying;

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }

  if(musicPlaying){
    musicTimer=setInterval(()=>{
      musicSeconds++;

      if(musicSeconds>=180){
        musicSeconds=0;
        musicPlaying=false;

        clearInterval(musicTimer);
        musicTimer=null;
      }

      const bar=document.getElementById('musicProgress');
      const time=document.getElementById('musicTime');
      const button=document.getElementById('musicPlayButton');

      if(bar)bar.style.width=(musicSeconds/180*100)+'%';

      if(time){
        time.textContent=formatMusicTime(musicSeconds)+' / 03:00';
      }

      if(button){
        button.textContent=musicPlaying?'⏸':'▶';
      }
    },1000);
  }

  const button=document.getElementById('musicPlayButton');

  if(button){
    button.textContent=musicPlaying?'⏸':'▶';
  }
}

function resetMusic(){
  musicSeconds=0;
  musicPlaying=false;

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }

  renderMusic();
}

/* Safari: 웹사이트 내부 가상 화면 */
function renderSafari(){
  setBody(`
    <div class="browser-bar">
      <input class="field" id="virtualAddress" placeholder="검색어 입력">

      <button class="action" onclick="virtualSearch()">검색</button>
    </div>

    <div class="browser-preview" id="browserPreview">
      <h2>Safari</h2>
      <p>김솔음의 가상 브라우저</p>
    </div>
  `);
}

function virtualSearch(){
  const query=document.getElementById('virtualAddress').value.trim();
  if(!query)return;

  document.getElementById('browserPreview').innerHTML=`
    <h2>검색 결과</h2>
    <p><b>${esc(query)}</b></p>
    <p>가상 Safari 검색 화면입니다.</p>
  `;
}


<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>김솔음의 휴대폰</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.phone{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:radial-gradient(
    ellipse at 50% 25%,
    #19191b,
    #080808 78%
  );
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}

/* 상단 상태바 */

.status{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  z-index:20;
  font-size:15px;
  font-weight:600;
  pointer-events:none;
}

.island{
  position:absolute;
  top:11px;
  left:50%;
  transform:translateX(-50%);
  width:110px;
  height:31px;
  border-radius:22px;
  background:#000;
}

.indicators{
  display:flex;
  align-items:flex-end;
  gap:10px;
}

.signal{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:15px;
}

.signal i{
  display:block;
  width:4px;
  background:#fff;
  border-radius:2px;
}

.signal i:nth-child(1){height:5px}
.signal i:nth-child(2){height:8px}
.signal i:nth-child(3){height:12px}
.signal i:nth-child(4){height:15px}

.battery{
  position:relative;
  width:25px;
  height:13px;
  border:1.7px solid #fff;
  border-radius:4px;
  padding:2px;
}

.battery:after{
  content:"";
  position:absolute;
  right:-4px;
  top:3px;
  width:2px;
  height:5px;
  background:#fff;
  border-radius:2px;
}

.battery-fill{
  width:70%;
  height:100%;
  background:#fff;
  border-radius:1px;
}

.homebar{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:5px;
  background:#fff;
  border-radius:10px;
  z-index:30;
  cursor:pointer;
}

/* 잠금화면 */

#lock{
  touch-action:pan-y;
}

.lockclock{
  position:absolute;
  top:clamp(100px,16%,155px);
  left:0;
  right:0;
  text-align:center;
}

.bigtime{
  font-size:clamp(66px,19vw,92px);
  font-weight:200;
  letter-spacing:-3px;
  line-height:1.12;
}

.date{
  font-size:19px;
  margin-top:10px;
}

.locktip{
  position:absolute;
  bottom:112px;
  left:0;
  right:0;
  text-align:center;
  color:#bbb;
  font-size:13px;
}

.lockbottom{
  position:absolute;
  bottom:42px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 34px;
}

.round{
  width:49px;
  height:49px;
  border:0;
  border-radius:50%;
  background:#ffffff24;
  display:grid;
  place-items:center;
}

.round svg{
  width:24px;
  height:24px;
  stroke:#fff;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* 비밀번호 화면 */

#pass{
  overflow:hidden;
  --key-size:clamp(48px,8.3vh,72px);
  --key-gap-y:clamp(5px,1.5vh,13px);
}

.passwrap{
  position:absolute;
  top:56px;
  bottom:30px;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:8px 12px;
}

.passlabel{
  font-size:21px;
  margin-bottom:12px;
}

.hint{
  min-height:24px;
  margin-bottom:8px;
  color:#ffce67;
  font-size:14px;
  text-align:center;
}

.dots{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:clamp(12px,3vh,30px);
}

.dot{
  width:13px;
  height:13px;
  border:1.5px solid #fff;
  border-radius:50%;
}

.dot.filled{
  background:#fff;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,var(--key-size));
  gap:var(--key-gap-y) 19px;
  justify-content:center;
}

.key{
  width:var(--key-size);
  height:var(--key-size);
  border:0;
  border-radius:50%;
  background:#ffffff25;
  font-size:clamp(22px,4vh,30px);
  font-weight:300;
}

.key:active{
  background:#ffffff55;
}

.passfooter{
  width:calc(var(--key-size) * 3 + 38px);
  display:flex;
  justify-content:space-between;
  margin-top:clamp(10px,2vh,23px);
}

.passfooter button{
  border:0;
  background:none;
  font-size:15px;
}

/* 홈 화면 */

.apps{
  position:absolute;
  top:14.5%;
  left:0;
  right:0;
  padding:0 6%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:12px;
  row-gap:29px;
}

.app{
  text-align:center;
  min-width:0;
}

.appicon{
  width:min(100%,62px);
  aspect-ratio:1;
  margin:auto;
  border-radius:15px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#333;
  box-shadow:0 3px 9px #00000025;
}

.appicon svg{
  display:block;
  width:100%;
  height:100%;
}

.appname{
  font-size:12px;
  margin-top:8px;
  white-space:nowrap;
}

/* Dock */

.dock{
  position:absolute;
  bottom:34px;
  left:3%;
  width:94%;
  padding:14px 9px;
  border-radius:32px;
  background:#ffffff2e;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}

.dock .appicon{
  width:min(100%,62px);
}

.dock .appname{
  display:none;
}

/* 카카오톡 화면 */

.kakao-screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  z-index:12;
  background:#fff;
  color:#191919;
}

.kakao-screen.active{
  display:flex;
}

/* 카카오톡 상단 */

.kakao-header{
  flex-shrink:0;
  padding:72px 20px 14px;
  background:#fff;
}

.kakao-top{
  display:flex;
  align-items:center;
  gap:13px;
  height:38px;
}

.kakao-back{
  border:0;
  background:none;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:35px;
  color:#111;
}

.kakao-back svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.kakao-title{
  font-size:27px;
  font-weight:750;
  letter-spacing:-0.8px;
}

/* 카카오톡 채팅 목록 */

.kakao-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:17px 0 12px;
  background:#fff;
}

.kakao-chat{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  min-height:89px;
  padding:13px 19px;
  background:#fff;
}

.kakao-avatar{
  width:57px;
  height:57px;
  flex-shrink:0;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.kakao-avatar svg{
  display:block;
  width:100%;
  height:100%;
}

.kakao-chat-info{
  flex:1;
  min-width:0;
}

.kakao-chat-name{
  font-size:16px;
  font-weight:650;
  line-height:1.4;
  letter-spacing:-0.35px;
  word-break:keep-all;
}

/* 카카오톡 하단 메뉴 */

.kakao-tabs{
  height:73px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-top:1px solid #ededed;
  background:#fff;
  padding-top:9px;
  padding-bottom:15px;
}

.kakao-tab{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#aaa;
  font-size:11px;
  font-weight:500;
}

.kakao-tab.selected{
  color:#161616;
  font-weight:700;
}

.kakao-tab svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.kakao-tab.selected svg{
  stroke-width:2.2;
}

.kakao-homebar{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:5px;
  background:#171717;
  border-radius:10px;
  z-index:15;
  cursor:pointer;
}

@media(max-height:650px){
  .apps{
    top:17%;
    row-gap:17px;
  }

  .apps .appicon,
  .dock .appicon{
    width:min(100%,56px);
  }

  .dock{
    padding:10px 8px;
  }

  .kakao-header{
    padding-top:59px;
  }
}

@media(max-height:580px){
  #pass{
    --key-size:clamp(39px,7.5vh,52px);
    --key-gap-y:4px;
  }

  .passwrap{
    top:45px;
    bottom:18px;
  }

  .passlabel{
    font-size:18px;
    margin-bottom:5px;
  }

  .hint{
    min-height:20px;
    margin-bottom:4px;
  }

  .dots{
    margin-bottom:9px;
  }

  .passfooter{
    margin-top:7px;
  }
}
</style>
</head>

<body>
<div class="phone">

<!-- 상태바 -->
<div class="status">
  <span id="statusTime">9:41</span>

  <div class="island"></div>

  <div class="indicators">
    <div class="signal">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="battery">
      <div class="battery-fill"></div>
    </div>
  </div>
</div>

<!-- 잠금화면 -->
<section class="screen active" id="lock">
  <div class="lockclock">
    <div class="bigtime" id="bigTime">9:41</div>
    <div class="date" id="date"></div>
  </div>

  <div class="locktip">위로 쓸어올려 잠금 해제</div>

  <div class="lockbottom">
    <button class="round" onclick="virtualFlashlight()" aria-label="손전등">
      <svg viewBox="0 0 24 24">
        <path d="M8 3h8v5l-2 3v9h-4v-9L8 8zM10 14h4"/>
      </svg>
    </button>

    <button class="round" onclick="show('pass')" aria-label="카메라">
      <svg viewBox="0 0 24 24">
        <path d="M3 7h4l2-3h6l2 3h4v13H3z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>
</section>

<!-- 비밀번호 화면 -->
<section class="screen" id="pass">
  <div class="passwrap">
    <div class="passlabel">암호 입력</div>
    <div class="hint" id="hint"></div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="keypad" id="keys"></div>

    <div class="passfooter">
      <button onclick="cancelPin()">취소</button>
      <button onclick="erasePin()">삭제</button>
    </div>
  </div>
</section>

<!-- 홈 화면 -->
<section class="screen" id="home">
  <div class="apps" id="apps"></div>
  <div class="dock" id="dock"></div>
</section>

<!-- 카카오톡 채팅 목록 화면 -->
<section class="kakao-screen" id="kakaoScreen">

  <div class="kakao-header">
    <div class="kakao-top">

      <button class="kakao-back" onclick="closeKakao()" aria-label="뒤로 가기">
        <svg viewBox="0 0 24 24">
          <path d="M15 4L7 12L15 20"/>
        </svg>
      </button>

      <div class="kakao-title">채팅</div>

    </div>
  </div>

  <div class="kakao-list">

    <!-- 첫 번째 채팅방: 백사헌 -->
    <div class="kakao-chat">
      <div class="kakao-avatar">
        <svg viewBox="0 0 80 80">
          <rect width="80" height="80" rx="24" fill="#181818"/>
        </svg>
      </div>
      <div class="kakao-chat-info">
        <div class="kakao-chat-name">백사헌</div>
      </div>
    </div>

    <!-- 두 번째 채팅방: 백일몽주식회사 동기 단톡방 -->
    <div class="kakao-chat">
      <div class="kakao-avatar">
        <svg viewBox="0 0 80 80">
          <rect width="80" height="80" rx="24" fill="#60a9a2"/>
          <text
            x="40" y="51"
            text-anchor="middle"
            font-size="33"
            font-weight="600"
            fill="#fff"
          >백</text>
        </svg>
      </div>
      <div class="kakao-chat-info">
        <div class="kakao-chat-name">백일몽주식회사 동기 단톡방</div>
      </div>
    </div>

    <!-- 세 번째 채팅방: 현장탐사팀 D조 -->
    <div class="kakao-chat">
      <div class="kakao-avatar">
        <svg viewBox="0 0 80 80">
          <rect width="80" height="80" rx="24" fill="#8b765b"/>
          <text
            x="40" y="51"
            text-anchor="middle"
            font-size="30"
            font-weight="600"
            fill="#fff"
          >D</text>
        </svg>
      </div>
      <div class="kakao-chat-info">
        <div class="kakao-chat-name">현장탐사팀 D조</div>
      </div>
    </div>

  </div>

  <!-- 하단 카카오톡 메뉴: 현재는 디자인만 표시 -->
  <nav class="kakao-tabs">

    <div class="kakao-tab">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21C4 16 7 14 12 14S20 16 20 21"/>
      </svg>
      <span>친구</span>
    </div>

    <div class="kakao-tab selected">
      <svg viewBox="0 0 24 24">
        <path d="M4 5H20V16H10L5 20V16H4Z"/>
      </svg>
      <span>채팅</span>
    </div>

    <div class="kakao-tab">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="3"/>
        <path d="M10 9L15 12L10 15Z"/>
      </svg>
      <span>뷰</span>
    </div>

    <div class="kakao-tab">
      <svg viewBox="0 0 24 24">
        <path d="M4 8H20L19 21H5Z"/>
        <path d="M9 9V6C9 2 15 2 15 6V9"/>
      </svg>
      <span>쇼핑</span>
    </div>

    <div class="kakao-tab">
      <svg viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.5"/>
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="19" cy="12" r="1.5"/>
      </svg>
      <span>더보기</span>
    </div>

  </nav>

  <div class="kakao-homebar" onclick="closeKakao()"></div>
</section>

<!-- 기본 홈 바 -->
<div class="homebar" id="homebar"></div>

</div>

/* 홈 화면 앱 순서 */
const mainApps=[
  '캘린더',
  '사진',
  '카메라',
  '지도',
  '메모',
  '날씨',
  '미리알림',
  '네이버',
  '카카오톡'
];

/* Dock 앱 순서 */
const dockApps=[
  '전화',
  'Safari',
  '메시지',
  '유튜브'
];

/* 앱 생성 */
function makeApp(name){
  const el=document.createElement('div');
  el.className='app';

  el.innerHTML=`
    <div class="appicon">${icons[name]}</div>
    <div class="appname">${name}</div>
  `;

  if(name==='카카오톡'){
    el.addEventListener('click',openKakao);
  }

  return el;
}

mainApps.forEach(name=>{
  document.getElementById('apps').appendChild(makeApp(name));
});

dockApps.forEach(name=>{
  document.getElementById('dock').appendChild(makeApp(name));
});

/* 카카오톡 열기 */
function openKakao(){
  document.getElementById('kakaoScreen').classList.add('active');
  document.getElementById('homebar').style.display='none';
}

/* 카카오톡 닫기 */
function closeKakao(){
  document.getElementById('kakaoScreen').classList.remove('active');
  document.getElementById('homebar').style.display='';
}

/* 실시간 시계 */
function updateClock(){
  const now=new Date();

  const time=now.toLocaleTimeString('ko-KR',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });

  document.getElementById('statusTime').textContent=time;
  document.getElementById('bigTime').textContent=time;

  document.getElementById('date').textContent=
    now.toLocaleDateString('ko-KR',{
      month:'long',
      day:'numeric',
      weekday:'long'
    });

  const days=[
    '일요일','월요일','화요일','수요일',
    '목요일','금요일','토요일'
  ];

  const cal=document.querySelector('#apps #calDay');
  const date=document.querySelector('#apps #calDate');

  if(cal)cal.textContent=days[now.getDay()];
  if(date)date.textContent=now.getDate();
}

updateClock();
setInterval(updateClock,1000);

/* 화면 전환 */
function show(id){
  document.querySelectorAll('.screen').forEach(screen=>{
    screen.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
}

/* 비밀번호 */
let pin='';
let checking=false;

function renderDots(){
  document.querySelectorAll('.dot').forEach((dot,i)=>{
    dot.classList.toggle('filled',i<pin.length);
  });
}

function addPin(n){
  if(checking||pin.length>=4)return;

  pin+=n;
  renderDots();

  if(pin.length===4){
    checking=true;

    setTimeout(()=>{
      if(pin==='0913'){
        pin='';
        renderDots();
        document.getElementById('hint').textContent='';
        show('home');

      }else if(pin==='0511'){
        pin='';
        renderDots();
        document.getElementById('hint').textContent=
          '그건 제 생일인데요, 주임님';

      }else{
        pin='';
        renderDots();
        document.getElementById('hint').textContent='힌트 : 생일';
      }

      checking=false;
    },220);
  }
}

function erasePin(){
  if(checking)return;
  pin=pin.slice(0,-1);
  renderDots();
}

function cancelPin(){
  pin='';
  checking=false;
  renderDots();
  document.getElementById('hint').textContent='';
  show('lock');
}

/* 키패드 */
const keys=document.getElementById('keys');

['1','2','3','4','5','6','7','8','9','','0',''].forEach(n=>{
  const button=document.createElement('button');
  button.className='key';
  button.textContent=n;

  if(n){
    button.onclick=()=>addPin(n);
  }else{
    button.style.visibility='hidden';
  }

  keys.appendChild(button);
});

/* 잠금화면 위로 쓸기 */
let startY=0;

document.getElementById('lock').addEventListener(
  'touchstart',
  e=>{
    startY=e.touches[0].clientY;
  },
  {passive:true}
);

document.getElementById('lock').addEventListener(
  'touchend',
  e=>{
    if(startY-e.changedTouches[0].clientY>45){
      show('pass');
    }
  }
);

document.getElementById('lock').addEventListener('click',e=>{
  if(!e.target.closest('button')){
    show('pass');
  }
});

/* 홈 인디케이터 */
document.getElementById('homebar').onclick=()=>{
  if(document.getElementById('lock').classList.contains('active')){
    show('pass');
  }else if(document.getElementById('pass').classList.contains('active')){
    cancelPin();
  }
};

/* 가상 손전등 */
function virtualFlashlight(){
  const lock=document.getElementById('lock');
  const enabled=lock.dataset.light==='on';

  lock.dataset.light=enabled?'off':'on';

  lock.style.background=enabled
    ?''
    :'radial-gradient(circle at 50% 50%,#777,#242424 80%)';
}
</script>

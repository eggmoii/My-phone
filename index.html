<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김솔음의 휴대폰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.screen{height:100dvh;min-height:480px;position:relative;overflow:hidden;background:#000}
.hidden{display:none!important}
.status{position:absolute;top:0;left:0;width:100%;height:58px;padding:15px 26px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);width:94px;height:28px;border-radius:22px;background:#141414}
.signals{display:flex;gap:5px;align-items:center}
.bars{font-size:14px;letter-spacing:-3px}
.battery{width:23px;height:11px;border:1.5px solid white;border-radius:3px;padding:2px}
.battery:after{content:"";display:block;width:85%;height:100%;background:white;border-radius:1px}
.lockclock{position:absolute;top:17%;width:100%;text-align:center}
.bigtime{font-size:clamp(65px,20vw,92px);font-weight:200;letter-spacing:-4px;line-height:1.1}
.date{font-size:19px;margin-top:10px}
.lockicon{margin-bottom:16px}
.lockicon svg{width:20px;height:20px}
.shortcuts{position:absolute;bottom:65px;width:100%;display:flex;justify-content:space-between;padding:0 35px}
.round{width:52px;height:52px;border:0;border-radius:50%;background:#303030;color:white;display:grid;place-items:center}
.round svg{width:23px;height:23px}
.hint{position:absolute;bottom:36px;text-align:center;width:100%;font-size:13px;color:#bbb}
.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:125px;height:5px;background:white;border-radius:10px;z-index:10;touch-action:none}
#lock{touch-action:pan-y}
#pass{text-align:center}
.passarea{position:absolute;top:16%;width:100%}
.passlabel{font-size:19px;margin:20px 0}
.dots{display:flex;justify-content:center;gap:20px;margin:20px 0 35px}
.dot{width:13px;height:13px;border:1.5px solid white;border-radius:50%}
.dot.filled{background:white}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.key{height:72px;border:0;border-radius:50%;background:#292929;color:white;font-size:31px;font-weight:300}
.key:active{background:#666}
.key.blank{visibility:hidden}
.passbottom{position:absolute;bottom:65px;width:100%;display:flex;justify-content:space-around}
.passbottom button{background:none;border:0;color:white;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
#home{background:linear-gradient(145deg,#191919,#050505)}
.apps{position:absolute;top:105px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:25px 8px;padding:0 16px}
.app{text-align:center;font-size:12px}
.appicon{width:min(15vw,62px);height:min(15vw,62px);border-radius:15px;display:grid;place-items:center;margin:0 auto 6px;font-size:27px;color:white}
.dock{position:absolute;bottom:35px;left:4%;width:92%;background:#4448;border-radius:27px;padding:14px 7px;display:flex;justify-content:space-around}
.dock .appicon{margin:0}
.toast{position:absolute;top:48%;width:100%;text-align:center;color:#ddd;font-size:15px;pointer-events:none}
</style>
</head>
<body>
<div id="lock" class="screen">
<div class="status"><span class="smalltime">9:41</span><div class="island"></div><div class="signals"><span class="bars">▂▄▆</span><span>◕</span><span class="battery"></span></div></div>
<div class="lockclock">
<div class="lockicon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
<div class="bigtime liveTime">9:41</div><div class="date" id="date"></div>
</div>
<div class="shortcuts">
<button class="round" aria-label="손전등"><svg viewBox="0 0 24 24" fill="white"><path d="M8 2h8l-1 8-3 3-3-3L8 2zm2 12h4v8h-4z"/></svg></button>
<button class="round" aria-label="카메라"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><rect x="2" y="6" width="20" height="15" rx="3"/><path d="M7 6l2-3h6l2 3"/><circle cx="12" cy="13" r="4"/></svg></button>
</div>
<div class="hint">위로 쓸어올려 잠금 해제</div><div class="homebar" id="swipebar"></div>
</div>
<div id="pass" class="screen hidden">
<div class="status"><span class="smalltime">9:41</span><div class="island"></div><div class="signals"><span class="bars">▂▄▆</span><span>◕</span><span class="battery"></span></div></div>
<div class="passarea">
<div style="font-size:24px">♙</div><div class="passlabel">암호 입력</div>
<div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="keypad" id="keys"></div>
</div>
<div class="passbottom"><button id="cancel">취소</button><button id="delete">지우기</button></div>
<div class="homebar"></div>
</div>
<div id="home" class="screen hidden">
<div class="status"><span class="smalltime">9:41</span><div class="island"></div><div class="signals"><span class="bars">▂▄▆</span><span>◕</span><span class="battery"></span></div></div>
<div class="apps" id="apps"></div>
<div class="dock" id="dock"></div>
<div class="toast hidden" id="toast">이 앱은 다음에 만들 거야!</div>
<div class="homebar" id="homebar"></div>
</div>
<script>
function clock(){
const n=new Date();
const t=n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
document.querySelectorAll('.smalltime,.liveTime').forEach(e=>e.textContent=t);
document.getElementById('date').textContent=n.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
clock();setInterval(clock,1000);
const lock=document.getElementById('lock'),pass=document.getElementById('pass'),home=document.getElementById('home');
function show(el){[lock,pass,home].forEach(x=>x.classList.add('hidden'));el.classList.remove('hidden')}
let startY=0;
lock.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});
lock.addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>55)show(pass)});
document.getElementById('swipebar').addEventListener('click',()=>show(pass));
let pin='';
const dots=[...document.querySelectorAll('.dot')];
function renderDots(){dots.forEach((d,i)=>d.classList.toggle('filled',i<pin.length))}
function enter(n){
if(pin.length>=4)return;
pin+=n;renderDots();
if(pin.length===4)setTimeout(()=>{
if(pin==='0913'){show(home)}
else{const d=document.getElementById('dots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),350)}
pin='';renderDots();
},180);
}
const keys=document.getElementById('keys');
['1','2','3','4','5','6','7','8','9','','0',''].forEach(n=>{
const b=document.createElement('button');b.className='key'+(!n?' blank':'');b.textContent=n;if(n)b.onclick=()=>enter(n);keys.appendChild(b);
});
document.getElementById('cancel').onclick=()=>{pin='';renderDots();show(lock)};
document.getElementById('delete').onclick=()=>{pin=pin.slice(0,-1);renderDots()};
const appList=[['메시지','💬','#34c759'],['사진','🌼','#f5f5f5'],['메모','📝','#e5b72f'],['캘린더','📅','#fafafa'],['음악','♫','#fa4260'],['SNS','𝕏','#242424'],['설정','⚙️','#777'],['비밀 폴더','🔒','#444']];
function makeApp(a){const b=document.createElement('div');b.className='app';b.innerHTML='<div class="appicon" style="background:'+a[2]+'">'+a[1]+'</div><span>'+a[0]+'</span>';b.onclick=()=>{const t=document.getElementById('toast');t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1300)};return b}
appList.forEach(a=>document.getElementById('apps').appendChild(makeApp(a)));
[['전화','☎','#34c759'],['Safari','🌐','#358af5'],['카메라','📷','#777'],['연락처','👤','#555']].forEach(a=>document.getElementById('dock').appendChild(makeApp(a)));
document.getElementById('homebar').onclick=()=>show(lock);
</script>
</body>
</html>
